services:
  - type: web
    name: nimblegate-mindset-coach
    runtime: static
    branch: web-app-ai
    buildCommand: sh scripts/build.sh
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
