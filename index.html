<title>NimbleGate Mindset Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: deck-style navy stage with soft blue/pink glows; sticky top bar with two groups of tabs
   (employees | our team); content in a 1120px column. One committed dark look that matches the Canva deck. */
:root {
  --bg: #061565;
  --bg-2: #0a1f86;
  --surface: #0d2595;
  --surface-2: #12309f;
  --line: rgba(120, 170, 255, 0.30);
  --ink: #f4f6ff;
  --muted: #b3bdec;
  --sky: #45b6ff;
  --pink: #f4a3d6;
  --gold: #ffd75e;
  --sales: #35c477;
  --ops: #5ea2ff;
  --hr: #ffa83a;
  --support: #b680ff;
  --good: #3fd59a;
  --warn: #ffcc4d;
  --bad: #ff7b8a;
  --dept: var(--sky);
  --f-display: "Lexend", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-hand: "Caveat", "Segoe Print", cursive;
  --r: 18px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--ink);
  font: 17px/1.55 var(--f-body);
  min-height: 100vh;
  overflow-x: hidden;
}
body::before, body::after {
  content: ""; position: fixed; z-index: 0; pointer-events: none; border-radius: 50%;
  filter: blur(70px); opacity: .55;
}
body::before { width: 480px; height: 420px; right: -160px; top: -120px;
  background: radial-gradient(circle at 40% 40%, var(--pink), transparent 60%), radial-gradient(circle at 70% 70%, #3a8bff, transparent 65%); }
body::after { width: 420px; height: 420px; left: -200px; bottom: -160px;
  background: radial-gradient(circle at 50% 50%, #2f7dff, transparent 60%), radial-gradient(circle at 70% 30%, var(--pink), transparent 55%); opacity: .4; }
body[data-dept="sales"] { --dept: var(--sales); }
body[data-dept="ops"] { --dept: var(--ops); }
body[data-dept="hr"] { --dept: var(--hr); }
body[data-dept="support"] { --dept: var(--support); }

h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 400; line-height: 1.15; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2.1rem, 5vw, 3.6rem); font-weight: 300; letter-spacing: -0.01em; }
h2 { font-size: clamp(1.6rem, 3.4vw, 2.4rem); font-weight: 300; }
h3 { font-size: 1.3rem; font-weight: 500; }
h4 { font-size: 1.02rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--sky); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 8px; }
.eyebrow { font: 600 .74rem/1 var(--f-display); text-transform: uppercase; letter-spacing: .14em; color: var(--sky); }
.muted { color: var(--muted); }
.hand { font-family: var(--f-hand); font-weight: 700; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: rgba(6, 21, 101, 0.86); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.topbar-in { max-width: 1160px; margin: 0 auto; padding: 10px 20px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); margin-right: auto; }
.brand-mark { width: 34px; height: 34px; flex: none; }
.brand b { font: 500 1.02rem/1.1 var(--f-display); display: block; }
.brand small { font-size: .74rem; color: var(--muted); }
.nav { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.nav-group { display: flex; gap: 2px; padding: 3px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,.04); }
.nav-label { font: 600 .62rem/1 var(--f-display); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); padding: 0 6px 0 10px; align-self: center; }
.tab {
  border: 0; background: none; padding: 7px 13px; border-radius: 999px; cursor: pointer; color: var(--muted);
  font: 500 .88rem/1 var(--f-display);
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
@media (max-width: 720px) {
  .nav { width: 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .nav::-webkit-scrollbar { display: none; }
  .nav-group { flex: none; }
  .tab { padding: 7px 11px; }
}

main { position: relative; z-index: 1; max-width: 1160px; margin: 0 auto; padding-block: 28px 80px; padding-inline: 20px; }
section.view { display: grid; gap: 28px; }
.view-head { display: grid; gap: 10px; max-width: 760px; }
.view-head p { color: var(--muted); font-size: 1.08rem; }

/* ---------- generic blocks ---------- */
.panel { background: linear-gradient(180deg, rgba(18,48,159,.85), rgba(13,37,149,.85)); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; min-width: 0; }
.pill-box { border: 2px solid var(--sky); border-radius: 999px; padding: 10px 18px 10px 10px; display: inline-flex; gap: 12px; align-items: center; }
.play-dot { width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 10px 18px; cursor: pointer;
  border: 2px solid var(--sky); background: transparent; color: var(--ink); font: 500 .92rem/1 var(--f-display); text-decoration: none;
}
.btn:hover { background: rgba(69,182,255,.14); }
.btn.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.solid:hover { background: #dfe6ff; }
.btn.small { padding: 7px 13px; font-size: .82rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font: 600 .74rem/1.2 var(--f-display); letter-spacing: .02em; border: 1px solid currentColor; }
.chip.sales { color: var(--sales); } .chip.ops { color: var(--ops); } .chip.hr { color: var(--hr); } .chip.support { color: var(--support); }
.chip.tool { color: var(--sky); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.grid-2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.grid-3 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.grid-4 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
ul.clean { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
ul.ticks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
ul.ticks li { padding-left: 26px; position: relative; }
ul.ticks li::before { content: ""; position: absolute; left: 2px; top: .45em; width: 12px; height: 7px; border-left: 2.5px solid var(--sky); border-bottom: 2.5px solid var(--sky); transform: rotate(-45deg); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font: 500 .9rem var(--f-display); transition: .25s; z-index: 50; pointer-events: none; }
.toast.on { opacity: 1; transform: translateX(-50%); }
.icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- HOME / COACH ---------- */
.hero { display: grid; gap: 22px; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: center; }
@media (max-width: 820px) { .hero { grid-template-columns: 1fr; } }
.hero h1 em { font-style: normal; background: linear-gradient(90deg, var(--sky), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.motto { font: 300 1.15rem/1.4 var(--f-display); color: var(--muted); }
.motto b { color: var(--ink); font-weight: 500; }
.chev { color: var(--ink); opacity: .9; }

.stepper { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.step-btn { border: 1px solid var(--line); background: rgba(255,255,255,.04); border-radius: 14px; padding: 12px; text-align: left; cursor: pointer; display: grid; gap: 4px; color: var(--muted); }
.step-btn .n { font: 600 .7rem/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; }
.step-btn b { font: 500 1.05rem/1.1 var(--f-display); color: var(--ink); }
.step-btn[aria-current="step"] { border-color: var(--dept); background: color-mix(in srgb, var(--dept) 18%, transparent); color: var(--ink); }
.step-btn.done b::after { content: " ✓"; color: var(--good); }
@media (max-width: 560px) { .step-btn small { display: none; } .step-btn { padding: 10px 8px; } .step-btn b { font-size: .92rem; } }

.dept-pick { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }
.dept-card {
  --c: var(--sky);
  border: 2px solid color-mix(in srgb, var(--c) 55%, transparent); background: color-mix(in srgb, var(--c) 10%, var(--surface));
  border-radius: var(--r); padding: 16px; text-align: left; cursor: pointer; display: grid; gap: 8px; color: var(--ink);
  transition: transform .15s, border-color .15s;
}
.dept-card:hover { transform: translateY(-2px); border-color: var(--c); }
.dept-card[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 26%, var(--surface)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 25%, transparent); }
.dept-card .ic { width: 44px; height: 44px; border-radius: 50%; background: var(--c); color: #071353; display: grid; place-items: center; }
.dept-card h4 { color: var(--c); text-transform: uppercase; letter-spacing: .08em; font-size: .85rem; }
.dept-card p { font-size: .95rem; }
.dept-card.sales { --c: var(--sales); } .dept-card.ops { --c: var(--ops); } .dept-card.hr { --c: var(--hr); } .dept-card.support { --c: var(--support); }

.worry { display: grid; gap: 8px; }
.worry input[type=range] { width: 100%; accent-color: var(--dept); }
.worry-scale { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); }

.flip { perspective: 1200px; cursor: pointer; border: 0; background: none; padding: 0; text-align: left; width: 100%; }
.flip-in { position: relative; min-height: 240px; transition: transform .6s cubic-bezier(.3,.7,.2,1); transform-style: preserve-3d; display: grid; }
.flip.on .flip-in { transform: rotateY(180deg); }
.face { grid-area: 1/1; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--r); padding: 26px; display: grid; gap: 12px; align-content: center; }
.face.front { background: #1a1f4f; border: 2px dashed rgba(255,123,138,.6); }
.face.back { background: linear-gradient(135deg, #eadcff, #ffe1f2 60%, #dff0ff); color: #20135c; transform: rotateY(180deg); }
.face .label { font: 600 .72rem/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; }
.face.front .label { color: var(--bad); }
.face.back .label { color: #6a2fb8; }
.face q { font: 300 clamp(1.15rem, 2.4vw, 1.5rem)/1.35 var(--f-display); quotes: "“" "”"; }
.face.back q { font: 700 clamp(1.5rem, 3vw, 2rem)/1.15 var(--f-hand); }
.face .hint { font-size: .85rem; opacity: .75; }
@media (prefers-reduced-motion: reduce) { .flip-in { transition: none; } }

.reframe-list { display: grid; gap: 8px; }
.rf { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; cursor: pointer; background: rgba(255,255,255,.03); text-align: left; color: var(--ink); width: 100%; }
.rf .from { color: var(--muted); text-decoration: none; }
.rf .to { font-weight: 700; color: var(--pink); opacity: 0; transition: opacity .3s; }
.rf.on .from { text-decoration: line-through; text-decoration-color: var(--bad); }
.rf.on .to { opacity: 1; }
.own-reframe { display: grid; gap: 10px; }
.field { display: grid; gap: 6px; }
.field label { font: 500 .85rem var(--f-display); color: var(--muted); }
.input, textarea.input {
  width: 100%; border: 1px solid var(--line); background: rgba(3,10,60,.55); border-radius: 12px; padding: 11px 13px; color: var(--ink);
}
textarea.input { min-height: 84px; resize: vertical; }
.input:focus { outline: 2px solid var(--dept); border-color: transparent; }
.out-hand { font: 700 1.6rem/1.2 var(--f-hand); color: var(--pink); min-height: 1.2em; }

.coach-nav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.small-step { border-left: 4px solid var(--dept); padding: 12px 16px; background: color-mix(in srgb, var(--dept) 12%, transparent); border-radius: 0 12px 12px 0; }
.meter-compare { display: grid; gap: 10px; }
.bar { height: 12px; border-radius: 999px; background: rgba(255,255,255,.1); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--dept); transition: width .4s; }
.remember { background: #04104f; border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 14px; }
.remember-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 12px; }
.remember-row div { border-left: 1px solid var(--line); padding-left: 12px; font-size: .92rem; }
.tape { background: var(--gold); color: #1c1650; font: 700 1.35rem/1.2 var(--f-hand); padding: 8px 20px; transform: rotate(-1deg); justify-self: center; border-radius: 4px; text-align: center; }

/* ---------- JOB AID ---------- */
.aid { background: #f7f9ff; color: #10204f; border-radius: 22px; padding: 14px; display: grid; gap: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
.aid-head { background: #0a2463; color: #fff; border-radius: 14px; padding: 18px 20px; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 16px; align-items: center; }
.aid-head h2 { font: 600 clamp(1.5rem, 3.2vw, 2.2rem)/1 var(--f-display); letter-spacing: .02em; }
.aid-head .flow { font: 700 clamp(1.3rem, 2.6vw, 1.8rem)/1.1 var(--f-hand); color: var(--gold); }
.aid-head .side { font: 700 1.05rem/1.15 var(--f-hand); max-width: 160px; border-left: 1px solid rgba(255,255,255,.35); padding-left: 14px; }
@media (max-width: 700px) { .aid-head { grid-template-columns: 1fr; } .aid-head .side { border-left: 0; padding-left: 0; max-width: none; } .aid-head > svg { display: none; } }
.aid-row { border-radius: 14px; padding: 14px; display: grid; grid-template-columns: minmax(170px, 0.9fr) minmax(0, 3fr); gap: 14px; align-items: stretch; }
@media (max-width: 760px) { .aid-row { grid-template-columns: 1fr; } }
.aid-row.pause { background: #e6f0ff; } .aid-row.reframe { background: #f1e8ff; } .aid-row.act { background: #e6f7ec; } .aid-row.learn { background: #e3f4f8; }
.aid-step { display: grid; gap: 6px; align-content: start; }
.aid-step .num { display: flex; gap: 10px; align-items: center; }
.aid-step .circle { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: #fff; flex: none; }
.pause .circle { background: #1663d6; } .reframe .circle { background: #6b2bb5; } .act .circle { background: #128a3c; } .learn .circle { background: #157a99; }
.aid-step h3 { font: 600 1.3rem/1 var(--f-display); }
.pause h3 { color: #1663d6; } .reframe h3 { color: #6b2bb5; } .act h3 { color: #128a3c; } .learn h3 { color: #157a99; }
.aid-step small { font: 600 .85rem var(--f-display); color: #334; }
.aid-step p { font-size: .9rem; color: #334166; }
.aid-cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .aid-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.aid-col { border-radius: 12px; padding: 10px; display: grid; gap: 6px; align-content: start; text-align: center; border: 1.5px solid; font-size: .86rem; line-height: 1.35; transition: opacity .2s, transform .2s; color: #1b2550; }
.aid-col .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; justify-self: center; }
.aid-col b { font: 700 .74rem var(--f-display); letter-spacing: .08em; text-transform: uppercase; }
.aid-col.sales { background: #e9f8ee; border-color: #8fd9a8; } .aid-col.sales .ic { background: #1f9d55; } .aid-col.sales b { color: #157a40; }
.aid-col.ops { background: #e7f0ff; border-color: #9cc0ff; } .aid-col.ops .ic { background: #2364d2; } .aid-col.ops b { color: #1d55b8; }
.aid-col.hr { background: #fff4e3; border-color: #ffc876; } .aid-col.hr .ic { background: #e88a0c; } .aid-col.hr b { color: #b86a00; }
.aid-col.support { background: #f3eaff; border-color: #c9a6ff; } .aid-col.support .ic { background: #7b3fd6; } .aid-col.support b { color: #6a2fc0; }
.aid-col .tooltag { font: 600 .7rem/1.2 var(--f-display); color: #0a2463; background: #fff; border-radius: 999px; padding: 3px 8px; justify-self: center; border: 1px solid #c6d3f5; }
.aid.focus .aid-col { opacity: .35; }
.aid.focus .aid-col.is-focus { opacity: 1; transform: scale(1.03); box-shadow: 0 6px 20px rgba(10,36,99,.18); }
.aid-quote { font: 700 1.35rem/1.2 var(--f-hand); color: #4b1f96; background: #e6d6ff; border-radius: 10px; padding: 12px; }
.aid-reframes { display: grid; gap: 4px; font-size: .85rem; }
.aid-reframes span { color: #555f80; } .aid-reframes b { color: #5a24a8; }
.aid-learn { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 10px; align-items: center; }
.aid-learn ul { list-style: none; margin: 0; padding: 12px; background: #fff; border: 1px solid #bfe0ea; border-radius: 10px; display: grid; gap: 4px; font-size: .9rem; }
.aid-learn li::before { content: "✓"; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: #157a99; color: #fff; font-size: .7rem; margin-right: 8px; }
.aid-learn .sprout { font: 700 1.2rem/1.1 var(--f-hand); color: #134a5c; text-align: center; }
.aid-check { background: #fff; border: 1px solid #c6d3f5; border-radius: 10px; padding: 10px 12px; font-size: .86rem; display: grid; gap: 4px; }
.aid-check b { font: 600 .8rem var(--f-display); color: #0a2463; }
.aid-foot { background: #0a2463; color: #fff; border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(4, minmax(0, 1fr)); gap: 12px; align-items: center; font-size: .86rem; }
.aid-foot .rem b { color: var(--gold); font: 600 .9rem var(--f-display); display: block; }
.aid-foot > div + div { border-left: 1px solid rgba(255,255,255,.3); padding-left: 12px; }
@media (max-width: 760px) { .aid-foot { grid-template-columns: 1fr 1fr; } .aid-foot .rem { grid-column: 1 / -1; } .aid-foot > div + div { border-left: 0; padding-left: 0; } }
.aid-tape { background: var(--gold); color: #10204f; font: 700 1.3rem/1.2 var(--f-hand); text-align: center; padding: 6px 14px; transform: rotate(-.6deg); border-radius: 4px; justify-self: center; }
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filter { border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 7px 14px; cursor: pointer; font: 500 .85rem var(--f-display); color: var(--muted); }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ---------- TOOLKIT ---------- */
.tool-switch { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.tool-tab { text-align: left; border: 2px solid var(--line); border-radius: var(--r); background: rgba(255,255,255,.03); padding: 16px; cursor: pointer; display: grid; gap: 6px; color: var(--ink); }
.tool-tab .n { font: 600 .72rem var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--sky); }
.tool-tab b { font: 500 1.1rem/1.2 var(--f-display); }
.tool-tab[aria-selected="true"] { border-color: var(--sky); background: rgba(69,182,255,.12); }
.spec { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.spec-row { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 16px; padding: 14px 18px; border-top: 1px solid var(--line); }
.spec-row:first-child { border-top: 0; }
.spec-row dt { font: 600 .78rem/1.4 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--sky); }
.spec-row dd { margin: 0; min-width: 0; }
.spec-row ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
@media (max-width: 640px) { .spec-row { grid-template-columns: 1fr; gap: 4px; } }
.sub-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.table-wrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--line); }
table.rolemap { width: 100%; border-collapse: collapse; min-width: 520px; font-size: .95rem; }
.rolemap th { text-align: left; padding: 10px 14px; font: 600 .8rem var(--f-display); letter-spacing: .1em; text-transform: uppercase; }
.rolemap th.ai { background: rgba(69,182,255,.2); color: var(--sky); }

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 1800); }
function copy(text, label = "Copied") {
  const done = () => toast(label);
  try {
    navigator.clipboard.writeText(text).then(done, () => fallback());
  } catch (e) { fallback(); }
  function fallback() {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { toast("Select the text to copy it"); }
    ta.remove();
  }
}

const VIEWS = { coach: renderCoach, aid: renderAid, tools: renderTools, challenges: renderChallenges, present: renderPresent, assignment: renderAssignment };
function go(view, opts = {}) {
  if (!VIEWS[view]) view = "coach";
  S.view = view;
  if (opts.tool) S.tool = opts.tool;
  if (opts.dept) { S.dept = opts.dept; S.mapDept = opts.dept; }
  if (opts.draft) S.draft = opts.draft;
  save();
  document.body.dataset.dept = S.dept;
  $$(".tab").forEach((t) => t.setAttribute("aria-selected", String(t.dataset.go === view)));
  try { history.replaceState(null, "", "#" + view); } catch (e) {}
  const app = $("#app");
  app.innerHTML = "";
  VIEWS[view](app);
  if (!opts.keepScroll) window.scrollTo(0, 0);
  if (opts.scrollTo) { const el = document.getElementById(opts.scrollTo); if (el) el.scrollIntoView({ block: "start" }); }
}
document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-go]");

    go(g.dataset.go, { tool: +g.dataset.tool || 0, dept: g.dataset.dept || "", draft: g.dataset.draft || "", scrollTo: g.dataset.scroll || "" });

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function newSorter(dept) {
  const m = ROLEMAP[dept];
  return { dept, i: 0, res: [], items: shuffle([...m.does.map((t) => ({ t, a: "ai" })), ...m.you.map((t) => ({ t, a: "you" }))]).slice(0, 8) };
}
function mountSorter(el, dept) {
  if (!S.sorter || S.sorter.dept !== dept) { S.sorter = newSorter(dept); save(); }
  const g = S.sorter;
  const done = g.i >= g.items.length;
  const right = g.res.filter(Boolean).length;
  const dots = g.items.map((_, k) => `<i class="${k < g.res.length ? (g.res[k] ? "ok" : "no") : ""} ${k === g.i ? "cur" : ""}"></i>`).join("");
  if (done) {
    el.innerHTML = `<div class="sorter"><div class="sort-card">
      <span class="eyebrow">Role Map practice · ${DEPTS[dept].name}</span>
      <p class="task">You sorted <b>${right} of ${g.items.length}</b> correctly.</p>
      <p class="muted">${ROLEMAP[dept].remember}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn solid" id="again">Play again</button>
      <button class="btn" data-go="tools" data-tool="1" data-dept="${dept}">See the full ${DEPTS[dept].name} map</button></div>
    </div></div>`;
    $("#again", el).addEventListener("click", () => { S.sorter = newSorter(dept); save(); mountSorter(el, dept); });
    return;
  }
  const it = g.items[g.i];
  el.innerHTML = `<div class="sorter">
    <div class="score"><span>Who does this? AI or you?</span><span class="dots">${dots}</span><span class="muted">${right} right</span></div>
    <div class="sort-card">
      <span class="eyebrow">Task ${g.i + 1} of ${g.items.length} · ${DEPTS[dept].name}</span>
      <p class="task">${it.t}</p>
      <div class="sort-actions">
        <button class="sort-btn ai" data-a="ai">AI does</button>
        <button class="sort-btn you" data-a="you">You do</button>
      </div>
      <div id="fb"></div>
    </div></div>`;
  $$(".sort-btn", el).forEach((b) => b.addEventListener("click", () => {
    const ok = b.dataset.a === it.a;
    $$(".sort-btn", el).forEach((x) => (x.disabled = true));
    const why = it.a === "ai" ? "Repetitive prep work. AI drafts or organizes it, then you review." : "Personal, high-stakes or a judgment call. This stays human.";
    $("#fb", el).innerHTML = `<div class="feedback ${ok ? "ok" : "no"}"><b>${ok ? "Right!" : "Not quite."}</b> ${it.a === "ai" ? "AI does" : "You do"}: ${why}</div>
      <div style="margin-top:10px"><button class="btn solid small" id="nx">Next task →</button></div>`;
    g.res.push(ok);
    $("#nx", el).addEventListener("click", () => { g.i++; save(); mountSorter(el, dept); });
    $("#nx", el).focus();
  }));
}

function tick() { cancelAnimationFrame(timer.raf); timer.raf = requestAnimationFrame(() => { if (!timer.running) return; timer.elapsed = (performance.now() - timer.start) / 1000; paintTimer(); tick(); }); }
function paintTimer() {

});
