<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0a0b">
<meta name="robots" content="noindex">
<title>Big Screen · Ghouls Gone Wild</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Creepster&family=Inter:wght@400;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="vendor/qrcode.js"></script>
<style>
  body { overflow: hidden; }
  .stage { height: 100vh; height: 100dvh; display: grid; grid-template-columns: minmax(320px, 34vw) 1fr; gap: 3vw; padding: 3vw; }
  .left { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1.6vh; }
  .left .bat { width: 9vw; min-width: 100px; animation: flap 3.2s ease-in-out infinite; }
  .left .ticket { width: 100%; padding: 2.4vh 2vw; --notch: 16px; }
  .left .contest-title { font-size: clamp(40px, 5.6vw, 110px); margin: 0 0 0.5vh; }
  .left .party-name { font-size: clamp(18px, 1.8vw, 34px); }
  .qr { background: #fff; padding: 1.2vw; border-radius: 18px; width: min(24vw, 34vh); box-shadow: 0 0 40px rgba(159, 224, 191, 0.25); }
  .qr svg { display: block; width: 100%; height: auto; }
  .scan { font: 800 clamp(18px, 1.8vw, 34px)/1.2 var(--font-body); }
  .url { font: 700 clamp(12px, 1vw, 18px) var(--font-mono); color: var(--muted); word-break: break-all; }

  .right { display: flex; flex-direction: column; min-height: 0; }
  .banner { display: flex; align-items: baseline; justify-content: space-between; gap: 2vw; margin-bottom: 3vh; }
  .banner h2 { font: 400 clamp(34px, 4.4vw, 90px)/1 var(--font-drip); margin: 0; letter-spacing: 0.04em; }
  .count { font: 700 clamp(16px, 1.5vw, 28px) var(--font-mono); color: var(--muted); white-space: nowrap; }
  .names { flex: 1; min-height: 0; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 1.4vw 1.4vw; overflow: hidden; }
  .name {
    display: inline-flex; align-items: center; gap: 0.9vw;
    background: linear-gradient(100deg, #5a1222, var(--maroon) 40%, #5e1424);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 999px;
    padding: 0.9vh 1.6vw 0.9vh 2vw;
    font-weight: 800;
    line-height: 1.15;
    max-width: 100%;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  }
  .name .txt { overflow-wrap: anywhere; }
  .name .n {
    font: 700 0.62em/1 var(--font-mono);
    background: rgba(0, 0, 0, 0.4);
    border-radius: 999px;
    padding: 0.45em 0.7em;
    white-space: nowrap;
  }
  .name.lead { background: var(--cream); color: var(--maroon-deep); box-shadow: 0 0 50px rgba(244, 238, 226, 0.25); }
  .name.lead .n { background: var(--maroon-deep); color: var(--cream); }
  .name.bump { animation: bump 0.9s ease-out; }
  @keyframes bump {
    0% { transform: scale(1.25); box-shadow: 0 0 0 6px var(--mint), 0 0 50px rgba(159, 224, 191, 0.6); }
    100% { transform: scale(1); }
  }
  .empty-wall { flex: 1; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: clamp(18px, 1.8vw, 32px); }
  .empty-wall .ghost { width: 10vw; min-width: 90px; animation: bob 3s ease-in-out infinite; display: block; margin: 0 auto 2vh; }

  .corner { position: fixed; right: 12px; bottom: 12px; z-index: 60; opacity: 0.25; transition: opacity 0.2s; }
  .corner:hover { opacity: 1; }
  .corner .btn { min-height: 36px; padding: 8px 12px; font-size: 13px; }

  @media (max-width: 800px), (orientation: portrait) {
    body { overflow: auto; }
    .stage { grid-template-columns: 1fr; height: auto; }
    .qr { width: min(70vw, 340px); }
    .names { overflow: visible; gap: 10px; }
    .name { padding: 8px 14px 8px 18px; gap: 10px; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="left">
    <span id="bat"></span>
    <div class="ticket">
      <p class="party-name">Ghouls Gone Wild</p>
      <h1 class="contest-title">Costume Contest</h1>
      <p class="prize">*Winner gets a gift basket*</p>
    </div>
    <div class="qr" id="qr"></div>
    <div class="scan">Scan to vote</div>
    <div class="url" id="url"></div>
  </div>
  <div class="right">
    <div class="banner"><h2>Best costume votes</h2><span class="count" id="count"></span></div>
    <div id="names-wrap" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
  </div>
</div>
<div class="corner"><button class="btn btn-soft" id="fs">⛶ Full screen</button></div>

<script type="module">
import { connect } from './app/backend.js';
import { $, esc, paintBackdrop, demoBanner, pageUrl, groupVotes, BAT, GHOST } from './app/common.js';

paintBackdrop();
demoBanner();
$('#bat').innerHTML = BAT;

const guestUrl = pageUrl('./');
const qr = qrcode(0, 'M');
qr.addData(guestUrl);
qr.make();
$('#qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true, alt: 'QR code to the voting page' });
$('#url').textContent = guestUrl.replace(/^https?:\/\//, '');

const api = await connect();
let prevCounts = new Map();

api.watchVotes(votes => {
  const groups = groupVotes(votes);
  $('#count').textContent = `${votes.length} vote${votes.length === 1 ? '' : 's'}`;
  if (!groups.length) {
    $('#names-wrap').innerHTML = `<div class="empty-wall"><div>${GHOST}Scan the code and type the name of your favorite costume!</div></div>`;
    prevCounts = new Map();
    return;
  }
  // Bigger text for more votes; the leader (or tied leaders) gets the cream pill.
  const top = groups[0].count;
  $('#names-wrap').innerHTML = `<div class="names">${groups.map(g => {
    const size = 1.6 + 1.6 * (g.count / top);
    const bumped = prevCounts.size && (prevCounts.get(g.key) ?? 0) < g.count;
    return `<div class="name ${g.count === top && top > 1 ? 'lead' : ''} ${bumped ? 'bump' : ''}" style="font-size:clamp(18px, ${size.toFixed(2)}vw, ${Math.round(size * 18)}px)">
      <span class="txt">${esc(g.name)}</span><span class="n">${g.count}</span></div>`;
  }).join('')}</div>`;
  prevCounts = new Map(groups.map(g => [g.key, g.count]));
});

$('#fs').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(() => {});
});
</script>
</body>
</html>
