<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0a0b">
<meta name="robots" content="noindex">
<title>Big Screen · Ghouls Gone Wild</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Creepster&family=Inter:wght@400;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="vendor/qrcode.js"></script>
<style>
  body { overflow: hidden; }
  .stage { height: 100vh; height: 100dvh; display: grid; grid-template-columns: minmax(320px, 34vw) 1fr; gap: 3vw; padding: 3vw; }
  .left { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 1.6vh; }
  .left .bat { width: 9vw; min-width: 100px; animation: flap 3.2s ease-in-out infinite; }
  .left .ticket { width: 100%; padding: 2.4vh 2vw; --notch: 16px; }
  .left .contest-title { font-size: clamp(40px, 5.6vw, 110px); margin: 0 0 0.5vh; }
  .left .party-name { font-size: clamp(18px, 1.8vw, 34px); }
  .qr { background: #fff; padding: 1.2vw; border-radius: 18px; width: min(24vw, 34vh); box-shadow: 0 0 40px rgba(159, 224, 191, 0.25); }
  .qr svg { display: block; width: 100%; height: auto; }
  .scan { font: 800 clamp(18px, 1.8vw, 34px)/1.2 var(--font-body); }
  .url { font: 700 clamp(12px, 1vw, 18px) var(--font-mono); color: var(--muted); word-break: break-all; }

  .right { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 0; }
  .right .ghost { width: 9vw; min-width: 90px; display: block; margin: 0 auto 2vh; }
  .tally { font: 700 clamp(120px, 20vw, 380px)/0.9 var(--font-mono); letter-spacing: -0.04em; }
  .tally.bump { animation: bump 0.7s ease-out; }
  @keyframes bump { 0% { transform: scale(1.18); color: var(--mint); } 100% { transform: scale(1); } }
  .tally-label { font: 400 clamp(36px, 4.6vw, 90px)/1 var(--font-drip); letter-spacing: 0.04em; margin-top: 2vh; }
  .tally-sub { font: 700 clamp(22px, 2.4vw, 46px)/1.1 var(--font-hand); color: var(--blood); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 1.5vh; }

  .overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; text-align: center; padding: 3vw; background: radial-gradient(circle at 50% 40%, #3a0a12, var(--ink) 70%); }
  .overlay .big { font: 400 clamp(60px, 12vw, 260px)/1 var(--font-drip); letter-spacing: 0.04em; }
  .overlay .sub { font: 700 clamp(26px, 3vw, 60px)/1.1 var(--font-hand); color: var(--blood); text-transform: uppercase; letter-spacing: 0.05em; }
  .overlay .ghost { width: 14vw; min-width: 120px; display: block; margin: 0 auto 3vh; }
  .count-num { animation: zoom 1s ease-out; display: inline-block; }
  @keyframes zoom { from { transform: scale(2.4); opacity: 0; } 30% { opacity: 1; } }
  .label { font: 700 clamp(18px, 1.8vw, 34px)/1 var(--font-body); letter-spacing: 0.2em; text-transform: uppercase; color: var(--mint); margin-bottom: 3vh; }
  .champ { font: 400 clamp(64px, 11vw, 230px)/0.95 var(--font-drip); letter-spacing: 0.03em; overflow-wrap: anywhere; animation: rise 0.9s cubic-bezier(.2, 1.4, .4, 1); text-shadow: 0 0 60px rgba(159, 224, 191, 0.35); }
  .champ + .champ { margin-top: 2vh; }
  .champ-votes { font: 700 clamp(20px, 2.2vw, 42px) var(--font-mono); color: var(--muted); margin-top: 2vh; }
  @keyframes rise { from { transform: translateY(40px) scale(0.8); opacity: 0; } }
  .runners { margin-top: 5vh; color: var(--muted); font-size: clamp(16px, 1.6vw, 30px); }
  .runners b { color: var(--cream); }

  .corner { position: fixed; right: 12px; bottom: 12px; z-index: 60; display: flex; gap: 8px; opacity: 0.25; transition: opacity 0.2s; }
  .corner:hover { opacity: 1; }
  .corner .btn { min-height: 36px; padding: 8px 12px; font-size: 13px; }

  @media (max-width: 800px), (orientation: portrait) {
    body { overflow: auto; }
    .stage { grid-template-columns: 1fr; height: auto; }
    .qr { width: min(70vw, 340px); }
    .right { padding: 6vh 0; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="left">
    <span id="bat"></span>
    <div class="ticket">
      <p class="party-name">Ghouls Gone Wild</p>
      <h1 class="contest-title">Costume Contest</h1>
      <p class="prize">*Winner gets a gift basket*</p>
    </div>
    <div class="qr" id="qr"></div>
    <div class="scan">Scan to vote</div>
    <div class="url" id="url"></div>
  </div>
  <div class="right">
    <span id="ghost"></span>
    <div class="tally" id="tally">0</div>
    <div class="tally-label" id="tally-label">votes so far</div>
    <div class="tally-sub">Winner revealed soon…</div>
  </div>
</div>
<div class="overlay" id="overlay" hidden></div>
<div class="corner">
  <button class="btn btn-soft" id="replay" hidden>↻ Replay reveal</button>
  <button class="btn btn-soft" id="fs">⛶ Full screen</button>
</div>

<script type="module">
import { connect } from './app/backend.js';
import { $, esc, paintBackdrop, demoBanner, pageUrl, winnersOf, confetti, BAT, GHOST } from './app/common.js';

paintBackdrop();
demoBanner();
$('#bat').innerHTML = BAT;
$('#ghost').innerHTML = GHOST;

const guestUrl = pageUrl('./');
const qr = qrcode(0, 'M');
qr.addData(guestUrl);
qr.make();
$('#qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true, alt: 'QR code to the voting page' });
$('#url').textContent = guestUrl.replace(/^https?:\/\//, '');

const api = await connect();
let lastCount = null, shownAt;

api.watchVotes(votes => {
  const n = votes.length;
  const el = $('#tally');
  el.textContent = n;
  $('#tally-label').textContent = n === 1 ? 'vote so far' : 'votes so far';
  if (lastCount !== null && n > lastCount) {
    el.classList.remove('bump');
    void el.offsetWidth; // restart the animation
    el.classList.add('bump');
  }
  lastCount = n;
});

let revealTimer = null, currentResults = null;
api.watchState(state => {
  currentResults = state.results;
  $('#replay').hidden = !state.revealed;
  if (!state.revealed) {
    clearTimeout(revealTimer);
    revealTimer = null;
    $('#overlay').hidden = true;
    shownAt = undefined;
    return;
  }
  const at = state.results?.at;
  if (at === shownAt) return;
  // Animate when the host reveals while this screen is open (or it reloads right after).
  const live = shownAt !== undefined || Date.now() - (at ?? 0) < 15000;
  shownAt = at;
  if (live) playReveal(state.results);
  else showWinner(state.results);
});

function playReveal(results) {
  clearTimeout(revealTimer);
  const overlay = $('#overlay');
  overlay.hidden = false;
  const seq = [
    `<div>${GHOST}<div class="sub">And the best costume goes to…</div></div>`,
    '<div class="big"><span class="count-num">3</span></div>',
    '<div class="big"><span class="count-num">2</span></div>',
    '<div class="big"><span class="count-num">1</span></div>',
  ];
  let i = 0;
  (function step() {
    if (i < seq.length) {
      overlay.innerHTML = seq[i++];
      revealTimer = setTimeout(step, i === 1 ? 2200 : 1000);
    } else {
      revealTimer = null;
      showWinner(results);
      confetti(6000);
    }
  })();
}

function showWinner(results) {
  const overlay = $('#overlay');
  overlay.hidden = false;
  const winners = winnersOf(results);
  if (!winners.length) {
    overlay.innerHTML = `<div>${GHOST}<div class="big">No votes!</div><div class="sub">The ghosts stayed home</div></div>`;
    return;
  }
  const runners = (results.ranking ?? []).filter(r => r.count < winners[0].count).slice(0, 3);
  const plural = n => `${n} vote${n === 1 ? '' : 's'}`;
  overlay.innerHTML = `<div>
    <div class="label">${winners.length > 1 ? '🏆 It’s a tie! 🏆' : '🏆 Best Costume 🏆'}</div>
    ${winners.map(w => `<div class="champ">${esc(w.name)}</div>`).join('')}
    <div class="champ-votes">${plural(winners[0].count)}${winners.length > 1 ? ' each' : ''}</div>
    ${runners.length ? `<div class="runners">Runners-up: ${runners.map(r => `<b>${esc(r.name)}</b> (${r.count})`).join(' · ')}</div>` : ''}
  </div>`;
}

$('#replay').addEventListener('click', () => playReveal(currentResults));
$('#fs').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(() => {});
});
</script>
</body>
</html>
