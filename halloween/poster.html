<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>QR Poster · Ghouls Gone Wild</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Creepster&family=Inter:wght@400;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="vendor/qrcode.js"></script>
<style>
  .sheet { max-width: 680px; margin: 0 auto; padding: 24px 16px 40px; text-align: center; }
  .sheet .hero { margin-bottom: 22px; }
  .qr { background: #fff; padding: 18px; border-radius: 18px; width: min(100%, 380px); margin: 0 auto 16px; }
  .qr svg { display: block; width: 100%; height: auto; }
  .scan { font: 400 clamp(30px, 8vw, 48px)/1 var(--font-drip); letter-spacing: 0.04em; margin: 6px 0 14px; }
  .how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 18px; padding: 0; list-style: none; }
  .how li { background: rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 12px 8px; font-weight: 700; font-size: 14px; line-height: 1.3; }
  .how li b { display: block; font: 700 26px/1 var(--font-mono); color: var(--mint); margin-bottom: 4px; }
  .url { font: 700 14px var(--font-mono); color: var(--muted); word-break: break-all; }
  .note { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .tools { margin: 24px 0 0; }
  .decor { display: flex; justify-content: center; gap: 30px; margin-top: 18px; }
  .decor svg { width: 64px; height: 64px; }
  @media print {
    @page { margin: 12mm; }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .backdrop, .tools, .demo-banner { display: none !important; }
    .sheet { padding: 0; }
  }
</style>
</head>
<body>
<div class="sheet">
  <header class="hero">
    <span id="bat"></span>
    <div class="ticket">
      <p class="party-name">Ghouls Gone Wild</p>
      <h1 class="contest-title">Costume<br>Contest</h1>
      <p class="prize">*Winner gets a gift basket*</p>
    </div>
  </header>
  <div class="scan">Scan to vote!</div>
  <div class="qr" id="qr"></div>
  <ol class="how">
    <li><b>1</b>Scan with your phone camera</li>
    <li><b>2</b>Type the name of your favorite costume</li>
    <li><b>3</b>Tap Vote and watch the TV</li>
  </ol>
  <div class="url" id="url"></div>
  <p class="note">No app to download. It opens right in your browser.</p>
  <div class="decor" id="decor"></div>
  <div class="tools">
    <button class="btn btn-primary" onclick="print()">🖨 Print poster</button>
  </div>
</div>
<script type="module">
import { $, paintBackdrop, demoBanner, pageUrl, BAT, GHOST, PUMPKIN } from './app/common.js';

paintBackdrop();
demoBanner();
$('#bat').innerHTML = BAT;
$('#decor').innerHTML = GHOST + PUMPKIN + GHOST;

const url = pageUrl('./');
const qr = qrcode(0, 'M');
qr.addData(url);
qr.make();
$('#qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true, alt: 'QR code to the costume contest' });
$('#url').textContent = url.replace(/^https?:\/\//, '');
</script>
</body>
</html>
