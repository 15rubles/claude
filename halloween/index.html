<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a0b">
<title>Costume Contest · Ghouls Gone Wild</title>
<meta name="description" content="Vote for the best costume at Ghouls Gone Wild.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎃</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Creepster&family=Inter:wght@400;600;700;800&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header class="hero">
    <span id="bat"></span>
    <div class="ticket">
      <p class="party-name">Ghouls Gone Wild</p>
      <h1 class="contest-title">Costume<br>Contest</h1>
      <p class="prize">*Winner gets a gift basket*</p>
    </div>
  </header>

  <form id="vote-form" class="card" novalidate>
    <h2>Who has the best costume?</h2>
    <p>Type their name and tap Vote. You get one vote, and you can change it any time.</p>
    <label class="field">Name
      <input id="vote-name" maxlength="40" autocomplete="off" autocapitalize="words" enterkeyhint="send" placeholder="e.g. Miracle" required>
    </label>
    <button type="submit" class="btn btn-primary btn-block" id="vote-btn" disabled>Connecting…</button>
  </form>

  <section id="voted" class="card voted-card" hidden aria-live="polite">
    <span class="pill pill-live">Vote counted</span>
    <p class="voted-for">You voted for <strong id="voted-name"></strong></p>
    <p>Watch the TV for the big reveal.</p>
    <button type="button" class="btn btn-soft btn-block" id="change-btn">Change my vote</button>
  </section>

  <footer class="foot">
    <div class="see">See you there</div>
    <div class="survive">if you survive…</div>
  </footer>
</main>

<script type="module">
import { connect } from './app/backend.js';
import { $, toast, paintBackdrop, demoBanner, BAT } from './app/common.js';

paintBackdrop();
demoBanner();
$('#bat').innerHTML = BAT;

const form = $('#vote-form'), input = $('#vote-name'), btn = $('#vote-btn');
const votedCard = $('#voted');
let myVote = null, changing = false;

let api;
try {
  api = await connect();
} catch (e) {
  btn.textContent = 'Couldn’t connect. Reload the page.';
  throw e;
}
btn.disabled = false;
btn.textContent = 'Vote';

api.watchMyVote(name => { myVote = name; render(); });

function render() {
  const showForm = !myVote || changing;
  form.hidden = !showForm;
  votedCard.hidden = showForm;
  $('#voted-name').textContent = myVote ?? '';
  btn.textContent = myVote ? 'Change vote' : 'Vote';
}

$('#change-btn').addEventListener('click', () => {
  changing = true;
  input.value = myVote ?? '';
  render();
  input.focus();
});

form.addEventListener('submit', async e => {
  e.preventDefault();
  btn.disabled = true;
  try {
    const wasVoted = Boolean(myVote);
    await api.castVote(input.value);
    changing = false;
    input.value = '';
    input.blur();
    toast(wasVoted ? 'Vote changed! 👻' : 'Vote counted! 👻');
    render();
  } catch (err) {
    toast(err.message, 'err');
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
